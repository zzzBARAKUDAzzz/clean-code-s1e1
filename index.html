<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link href='https://fonts.googleapis.com/css?family=Lato:300,400,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8">
</head>
<body>
<aside class="matrix-section"><img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix"><a class='matrix-section__link' href="https://goal-life.com/page/method/matrix-eisenhower">Want more details&quest;</a></aside>
<main class="todo-app"><section id='topSectionForAddingElementToList'><label for="new-task">Add Item</label><div class="task-form"><input id='new-task'class="task-form__input" type="text"><button type="button"class="task-form__button">Add</button></div>
</section><h3>Todo</h3>
<ul id='incompleteTasks'>
<li><input type='checkbox'><label class="task">Pay Bills</label><input type="text" class="task"><button type="button" class="edit">Edit</button><button type="button" class="delete"><img src="./remove.svg" alt="Delete"></button></li>
<li class="editMode"><input type="checkbox"><label class="task">Go Shopping</label><input type="text" value="Go Shopping" class="task"><button type="button" class='edit'>Save</button><button type="button" class="delete"><img src="./remove.svg" alt="Delete"></button></li>
</ul><h3>Completed</h3><ul id="completed-tasks"><li><input type="checkbox" checked><label class="task">See the Doctor</label><input type="text" class="task"><button type="button" class="edit">Edit</button><button type="button" class="delete"><img src="./remove.svg" alt="Delete"></button>
</li>
</ul>
</main>
<script type="text/javascript" src="app.js"></script>
</body>
</html>
